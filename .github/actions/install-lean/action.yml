name: Install Lean
description: >-
  Restore elan and the toolchain named in `lean-toolchain` from the Actions cache, or install them
  with bounded retries (#1426; cache saves disabled for this benchmark), and put elan on the path.
  Lean CI and the guide use
  it instead of `leanprover/lean-action`, which reinstalls elan from GitHub releases without
  retries. API docs still run that action after this one, for its GitHub cache restore.
runs:
  using: composite
  steps:
    # Restore the normal toolchain key, but never save from this benchmark branch.
    - name: Restore the Lean toolchain from the Actions cache
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
    - name: Install elan and the Lean toolchain, retrying transient failures
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install.sh" lean-toolchain'
    # Benchmark only: do not save any Actions cache.
    - name: Put elan on the path
      shell: bash
      run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
