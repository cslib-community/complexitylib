name: Install cache rsync
description: >-
  Reuse the pinned rsync implementation shared with the cache server. Requires an Ubuntu
  runner with passwordless sudo; verifies cached binaries before putting them on PATH.
outputs:
  prefix:
    description: Directory containing the pinned bin/rsync and bin/rrsync
    value: ${{ steps.layout.outputs.prefix }}
runs:
  using: composite
  steps:
    - name: Read the shared rsync pin and choose runner-local directories
      id: layout
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        python3 - <<'PY'
        import os
        from pathlib import Path
        import re

        settings = Path("infra/cache-server/vars.yml").read_text()
        def scalar(name, pattern):
            match = re.search(rf"^{name}:\s*({pattern})\s*$", settings, re.MULTILINE)
            if match is None:
                raise SystemExit(f"Missing or invalid shared rsync setting: {name}")
            return match[1]

        version = scalar("cache_server_rsync_version", r"[0-9]+\.[0-9]+\.[0-9]+")
        digest = scalar("cache_server_rsync_sha256", r"[0-9a-f]{64}")
        image = os.environ.get("ImageOS", "")
        if not re.fullmatch(r"[A-Za-z0-9_.-]+", image):
            raise SystemExit("ImageOS must identify the Ubuntu runner image")
        temporary = Path(os.environ["RUNNER_TEMP"])
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            for key, value in {
                "version": version,
                "digest": digest,
                "image": image,
                "prefix": temporary / "complexitylib-rsync" / version,
                "source": temporary / "complexitylib-rsync-source" / version,
            }.items():
                output.write(f"{key}={value}\n")
        PY
    # The cache contains the versioned installation only, never mutable source/build outputs.
    # Restore beneath runner.temp so actions/cache can extract it without root permissions.
    - name: Restore the pinned rsync installation
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.layout.outputs.prefix }}
        key: cache-rsync-${{ runner.os }}-${{ runner.arch }}-${{ steps.layout.outputs.image }}-${{ hashFiles('infra/cache-server/install-rsync.yml', 'infra/cache-server/vars.yml', 'infra/cache-server/test-install-rsync.yml', 'infra/cache-server/requirements.txt', '.github/actions/cache-rsync/action.yml') }}
    - name: Install runtime libraries, including on cache hits
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends \
          libacl1 libattr1 liblz4-1 libssl3 libxxhash0 libzstd1 zlib1g
    - name: Set up the pinned Ansible controller's Python
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: infra/cache-server/requirements.txt
    - name: Install the shared Ansible requirements
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: python -m pip install --require-hashes --requirement infra/cache-server/requirements.txt
    - name: Build with the cache server's installer
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        RSYNC_PREFIX: ${{ steps.layout.outputs.prefix }}
        RSYNC_SOURCE: ${{ steps.layout.outputs.source }}
      run: |
        set -euo pipefail
        settings="$(python - <<'PY'
        import json, os
        print(json.dumps({"cache_server_rsync_prefix": os.environ["RSYNC_PREFIX"],
                          "cache_server_rsync_source": os.environ["RSYNC_SOURCE"]}))
        PY
        )"
        ansible-playbook --inventory localhost, --connection local --become \
          infra/cache-server/test-install-rsync.yml --extra-vars "$settings"
    - name: Verify the installation and put it on PATH
      shell: bash
      env:
        RSYNC_PREFIX: ${{ steps.layout.outputs.prefix }}
        RSYNC_VERSION: ${{ steps.layout.outputs.version }}
        RSYNC_DIGEST: ${{ steps.layout.outputs.digest }}
      run: |
        set -euo pipefail
        test -x "$RSYNC_PREFIX/bin/rsync"
        test -x "$RSYNC_PREFIX/bin/rrsync"
        test "$(cat "$RSYNC_PREFIX/.installed")" = "$RSYNC_VERSION sha256:$RSYNC_DIGEST"
        version="$("$RSYNC_PREFIX/bin/rsync" --version)"
        test "$(printf '%s\n' "$version" | sed -n '1s/^rsync  version \([^ ]*\).*$/\1/p')" = "$RSYNC_VERSION"
        dependencies="$(ldd "$RSYNC_PREFIX/bin/rsync")"
        if [[ "$dependencies" == *"not found"* ]]; then
          printf '%s\n' "$dependencies" >&2
          exit 1
        fi
        printf '%s\n' "$version"
        printf '%s/bin\n' "$RSYNC_PREFIX" >> "$GITHUB_PATH"
    - name: Save the verified installation
      if: steps.restore.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.layout.outputs.prefix }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
