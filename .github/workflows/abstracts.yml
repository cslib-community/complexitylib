name: Formal abstract PDFs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "CslibFrontierTests/Abstracts/**"
      - "abstracts/**"
      - "lakefile.toml"
      - "scripts/abstract_to_tex.py"
      - "scripts/build_abstracts.py"
      - "scripts/proof_lengths.py"
      - "scripts/test_abstract*.py"
      - "scripts/test_build_abstracts.py"
      - "scripts/check_abstract_ci.py"
      - "scripts/test_check_abstract_ci.py"
      - ".github/workflows/abstracts.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new run for a pull request cancels that pull request's superseded run. Every other run uses
# its own run id so each `main` push builds and uploads the artifact consumed by `docs.yml`.
concurrency:
  group: abstracts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # What pdflatex reads: Libertine, newtxmath, Inconsolata (zi4) and mweights from
      # texlive-fonts-extra; tcolorbox, enumitem, xurl and titlesec from texlive-latex-extra;
      # binhex.tex from texlive-plain-generic; and Latin Modern for the renderer test. Poppler's
      # pdftotext checks margins.
      TEX_PACKAGES: >-
        latexmk lmodern texlive-latex-extra texlive-fonts-extra texlive-plain-generic poppler-utils
      # The downloaded archives (about 760 MB) are cached so that runs do not depend on the speed
      # of the Ubuntu mirror; apt still resolves them from its index and verifies their digests.
      TEX_DEBS: /var/cache/tex-debs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the curated selection
        run: python3 -B scripts/build_abstracts.py --check
      - name: Resolve PDF tooling packages
        id: tex-debs
        run: |
          sudo apt-get update
          sudo install -d -o "$USER" "$TEX_DEBS"
          # The cache key names the exact archives (file, size, digest) that apt would download.
          apt-get install --no-install-recommends -y -qq --print-uris \
            -o Dir::Cache::Archives="$TEX_DEBS" $TEX_PACKAGES \
            | awk '{print $2, $3, $4}' | sort > "$RUNNER_TEMP/tex-debs.txt"
          test -s "$RUNNER_TEMP/tex-debs.txt"
          echo "prefix=tex-debs-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=tex-debs-$ImageOS-$(sha256sum < "$RUNNER_TEMP/tex-debs.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore cached TeX packages
        id: tex-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/tex-debs
          key: ${{ steps.tex-debs.outputs.key }}
          restore-keys: ${{ steps.tex-debs.outputs.prefix }}
      - name: Install PDF tooling and fonts
        run: |
          sudo apt-get install --no-install-recommends -y \
            -o Dir::Cache::Archives="$TEX_DEBS" $TEX_PACKAGES
      # Pull requests read the cache saved by main; they do not write their own copies. Cache
      # maintenance never blocks the PDF build or its publication.
      - name: Prune the TeX package cache
        id: tex-debs-prune
        if: steps.tex-debs-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          sudo find "$TEX_DEBS" -mindepth 1 -maxdepth 1 ! -name '*.deb' -exec rm -rf {} +
          cut -d' ' -f1 "$RUNNER_TEMP/tex-debs.txt" > "$RUNNER_TEMP/tex-debs.keep"
          find "$TEX_DEBS" -maxdepth 1 -name '*.deb' -printf '%f\n' \
            | { grep -vxFf "$RUNNER_TEMP/tex-debs.keep" || true; } \
            | sed "s|^|$TEX_DEBS/|" | xargs -r sudo rm -f --
          diff <(ls "$TEX_DEBS" | sort) <(sort "$RUNNER_TEMP/tex-debs.keep")
      - name: Save the TeX package cache
        if: steps.tex-debs-prune.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/tex-debs
          key: ${{ steps.tex-debs.outputs.key }}
      - name: Test abstract generation
        run: python3 -B -m unittest discover -s scripts -p 'test_*abstract*.py'
      - name: Build individual PDFs, catalogue and provenance
        run: python3 -B scripts/build_abstracts.py --require-clean
      - name: Upload review artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: formal-abstracts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            abstracts/build/*.pdf
            abstracts/build/provenance.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
      - name: Link the source-pinned review artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("abstracts/build/provenance.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"[Download formal abstracts and provenance]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write(f"Checked-out source: `{source['source_sha']}`\n\n")
              if source["pull_request_head_sha"]:
                  summary.write(f"PR head: `{source['pull_request_head_sha']}`\n\n")
                  summary.write(f"PR base: `{source['pull_request_base_sha']}`\n\n")
              summary.write("Inspect rendered pages and source links before integration.\n")
          PY
