name: Merge-queue cleanup

# Lean CI merge-group runs each have their own concurrency group, so GitHub never cancels one whose
# entry has left the queue (it landed inside a later group, or the group was rebuilt after an
# ejection). This job cancels those runs so they release their runners. A merged group is followed
# by a push to `main`; the schedule covers ejections. See scripts/ci/cancel_stale_merge_groups.py.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: merge-queue-cleanup
  cancel-in-progress: false

jobs:
  cancel-stale-merge-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Cancel merge-group runs whose queue entry is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/cancel_stale_merge_groups.py --apply
