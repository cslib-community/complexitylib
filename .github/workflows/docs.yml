name: API documentation

# Builds of `main` deploy to https://www.cslib.io/complexitylib/, with the guide under guide/ and
# formal abstract PDFs under abstracts/. A manual run on another branch does not deploy; it uploads
# an `api-docs` artifact. Pull requests never run this; the Guide workflow builds pull requests
# that change the guide.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A newer build of the same branch supersedes an older one, so only the latest build deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation pins
        run: python3 scripts/check_docs.py --config-only
      # Restores or installs the toolchain with retries (.github/actions/install-lean, #1426).
      - uses: ./.github/actions/install-lean
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
      - name: Generate API documentation
        run: DISABLE_EQUATIONS=1 lake -d docbuild build Complexity:docs
      # Also catches library changes that break one of the guide's examples.
      - name: Build the guide
        run: scripts/guide.sh
      - name: Add the formal abstracts to the site
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/check_abstract_ci.py --wait-seconds 1200 \
            --download-dir docbuild/.lake/build/doc/abstracts
          echo "[Latest catalogue PDF](https://www.cslib.io/complexitylib/abstracts/catalogue.pdf)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check generated documentation and the guide's links into it
        run: python3 scripts/check_docs.py --trim --guide
      - name: Add the guide to the site
        run: cp -R guide/.lake/build/site/html-multi docbuild/.lake/build/doc/guide
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docbuild/.lake/build/doc
          if-no-files-found: error
      - name: Check published size
        run: |
          # Pages sites may be no larger than 1 GB; actions/deploy-pages reads that as 2^30 bytes.
          size=$(du -sb docbuild/.lake/build/doc | cut -f1)
          echo "Documentation size: $size bytes (GitHub Pages limit: 1073741824)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 1073741824 ]; then
            echo "::error::Documentation exceeds the 1 GB GitHub Pages limit"
            exit 1
          elif [ "$size" -gt 966367641 ]; then
            echo "::warning::Documentation uses over 90% of the 1 GB GitHub Pages limit"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
