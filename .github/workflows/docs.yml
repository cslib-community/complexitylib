name: API documentation

# Builds of `main` deploy to https://www.cslib.io/cslib-frontier/, with the guide under guide/. A
# manual run on another branch does not deploy; it uploads an `api-docs` artifact. Pull requests
# never run this; the Guide workflow builds pull requests that change the guide.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_RECOVERY_GENERATION: ${{ vars.CACHE_RECOVERY_GENERATION || '0' }}
  DISABLE_CACHE_RESTORE: ${{ vars.DISABLE_CACHE_RESTORE }}
  COMPLEXITYLIB_CACHE_URLS: ${{ vars.COMPLEXITYLIB_CACHE_URLS }}
  LAKE_NO_CACHE: ${{ vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1' }}
  MATHLIB_NO_CACHE_ON_UPDATE: ${{ (vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1') && '1' || '0' }}

# A newer build of the same branch supersedes an older one, so only the latest build deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # ubuntu-latest moved to Ubuntu 26.04 on 2026-10-30, and doc-gen4 has run out of memory there
    # ("resource exhausted (error code: 12)") on every run since; upstream cslib#1191 pins the same.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Daily source statistics need the complete first-parent history.
      - uses: actions/cache@v4
        with:
          path: tools/stats/.cache
          key: lean-stats-v1-${{ hashFiles('tools/stats/build.py', 'tools/stats/config.json') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            lean-stats-v1-${{ hashFiles('tools/stats/build.py', 'tools/stats/config.json') }}-
      - name: Install pinned Tokei
        run: bash tools/stats/install-tokei.sh "$RUNNER_TEMP/tokei-bin"
      - name: Build source history dashboard
        run: python3 tools/stats/build.py --tokei "$RUNNER_TEMP/tokei-bin/tokei"
      - name: Check documentation pins
        run: python3 scripts/check_docs.py --config-only
      # Restores or installs the toolchain with retries (.github/actions/install-lean, #1426).
      - uses: ./.github/actions/install-lean
      - name: Restore Mathlib cache with retries
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py --lean-action
      - name: Restore missing cslib-frontier build outputs
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - name: Generate API documentation
        run: DISABLE_EQUATIONS=1 lake -d docbuild build CslibFrontier:docs
      - name: Restore Guide dependencies
        id: guide-deps
        if: vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/cache-guide-deps
        with:
          generation: ${{ env.CACHE_RECOVERY_GENERATION }}
      # Also catches library changes that break one of the guide's examples.
      - name: Build the guide
        run: scripts/guide.sh
      - name: Check generated documentation and the guide's links into it
        run: python3 scripts/check_docs.py --trim --guide
      # One entry per compatible toolchain/pins/image, not per commit or PR. A failed optional
      # restore/save never replaces the normal Guide and generated-link checks above.
      - name: Save Guide dependency builds
        if: >-
          github.ref == 'refs/heads/main' &&
          vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
          steps.guide-deps.outcome == 'success' &&
          steps.guide-deps.outputs.key != '' && steps.guide-deps.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.guide-deps.outputs.paths }}
          key: ${{ steps.guide-deps.outputs.key }}
      - name: Add the guide to the site
        run: cp -R guide/.lake/build/site/html-multi docbuild/.lake/build/doc/guide
      - name: Add source history dashboard to the site
        run: cp -R tools/stats/_site docbuild/.lake/build/doc/stats
      # Built from this run's trimmed declaration index, so the tables match the published API.
      - name: Add class inclusion tables to the site
        run: |
          python3 -m unittest discover -s tools/class_inclusions -p 'test_*.py'
          python3 tools/class_inclusions/build.py \
            --index docbuild/.lake/build/doc/declarations/declaration-data.bmp \
            --output docbuild/.lake/build/doc/class-inclusions
      # GitHub Pages serves 404.html for missing paths. It sends API pages that the
      # module-root rename moved to their new addresses.
      - name: Add the not-found page
        run: cp docbuild/404.html docbuild/.lake/build/doc/404.html
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docbuild/.lake/build/doc
          if-no-files-found: error
      - name: Check published size
        run: |
          # Pages sites may be no larger than 1 GB; actions/deploy-pages reads that as 2^30 bytes.
          size=$(du -sb docbuild/.lake/build/doc | cut -f1)
          echo "Documentation size: $size bytes (GitHub Pages limit: 1073741824)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 1073741824 ]; then
            echo "::error::Documentation exceeds the 1 GB GitHub Pages limit"
            exit 1
          elif [ "$size" -gt 966367641 ]; then
            echo "::warning::Documentation uses over 90% of the 1 GB GitHub Pages limit"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
