name: Guide cache transfer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  COMPLEXITYLIB_CACHE_URLS: ${{ vars.COMPLEXITYLIB_CACHE_URLS }}
  DISABLE_CACHE_RESTORE: ${{ vars.DISABLE_CACHE_RESTORE }}
jobs:
  writer:
    outputs:
      key: ${{ steps.deps.outputs.key }}
    runs-on: cslib-ubuntu-24.04-8core
    timeout-minutes: 20
    env:
      LAKE_CACHE_DIR: ${{ runner.temp }}/guide-cache-probe
    steps:
      - name: Honor repository cache kill switch
        run: |
          test "$DISABLE_CACHE_RESTORE" != true
          test "$DISABLE_CACHE_RESTORE" != 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Restore fixed main root cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-0-Linux-X64-39707a83b53c737bd0252f90b111520c4f52892fb9aa2efa8f7d85a9861e7a74-52aaa34cb1dbb7fe55b090936195255e8e9597fad18b07be863ad1cb7aa313b2-12582c9cd57bb7ac8ffa8fd90b7e79dea45b143c
          fail-on-cache-miss: true
      - name: Restore elan without saving
        id: elan
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - if: steps.elan.outputs.cache-hit != 'true'
        run: .github/actions/install-lean/install.sh lean-toolchain
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py
      - name: Restore missing root outputs
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - run: python3 scripts/check_docs.py --config-only
      - name: Restore Guide dependency cache using production action
        id: deps
        uses: ./.github/actions/cache-guide-deps
        with:
          generation: diagnostic-${{ github.run_id }}
      - name: Require diagnostic miss
        env:
          CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
        run: test "$CACHE_HIT" != true
      - name: Measure cold example build
        run: python3 -u scripts/guide_cache_probe.py writer
      - name: Save small diagnostic entry on this branch only
        if: github.ref == 'refs/heads/test/guide-dependency-cache-20261114'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.deps.outputs.paths }}
          key: ${{ steps.deps.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-cache-writer
          path: ${{ runner.temp }}/guide-cache-probe-report
          retention-days: 7
  reader:
    needs: writer
    runs-on: cslib-ubuntu-24.04-8core
    timeout-minutes: 20
    env:
      LAKE_CACHE_DIR: ${{ runner.temp }}/guide-cache-probe
    steps:
      - name: Honor repository cache kill switch
        run: |
          test "$DISABLE_CACHE_RESTORE" != true
          test "$DISABLE_CACHE_RESTORE" != 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Restore fixed main root cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-0-Linux-X64-39707a83b53c737bd0252f90b111520c4f52892fb9aa2efa8f7d85a9861e7a74-52aaa34cb1dbb7fe55b090936195255e8e9597fad18b07be863ad1cb7aa313b2-12582c9cd57bb7ac8ffa8fd90b7e79dea45b143c
          fail-on-cache-miss: true
      - name: Restore elan without saving
        id: elan
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - if: steps.elan.outputs.cache-hit != 'true'
        run: .github/actions/install-lean/install.sh lean-toolchain
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py
      - name: Restore missing root outputs
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - run: python3 scripts/check_docs.py --config-only
      - name: Restore Guide dependency cache using production action
        id: deps
        uses: ./.github/actions/cache-guide-deps
        with:
          generation: diagnostic-${{ github.run_id }}
      - name: Require exact restored entry
        env:
          CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
          READER_KEY: ${{ steps.deps.outputs.key }}
          WRITER_KEY: ${{ needs.writer.outputs.key }}
        run: |
          test "$CACHE_HIT" = true
          test "$READER_KEY" = "$WRITER_KEY"
      - name: Measure cached example build
        run: python3 -u scripts/guide_cache_probe.py reader
      - name: Check changed chapter and warning enforcement
        run: python3 -u scripts/guide_cache_probe.py changed-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-cache-reader
          path: ${{ runner.temp }}/guide-cache-probe-report
          retention-days: 7
