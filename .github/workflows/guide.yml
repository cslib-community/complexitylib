name: Guide dependency profile

# Diagnostic branch only: same source as #5205 fa401, never PR/merge this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_RECOVERY_GENERATION: ${{ vars.CACHE_RECOVERY_GENERATION || '0' }}
  DISABLE_CACHE_RESTORE: ${{ vars.DISABLE_CACHE_RESTORE }}
  COMPLEXITYLIB_CACHE_URLS: ${{ vars.COMPLEXITYLIB_CACHE_URLS }}
  LAKE_NO_CACHE: ${{ vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1' }}
  MATHLIB_NO_CACHE_ON_UPDATE: ${{ (vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1') && '1' || '0' }}

jobs:
  guide-dependency-profile:
    runs-on: cslib-ubuntu-24.04-8core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Restore exact main root cache
        id: root-cache
        if: vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-0-Linux-X64-39707a83b53c737bd0252f90b111520c4f52892fb9aa2efa8f7d85a9861e7a74-52aaa34cb1dbb7fe55b090936195255e8e9597fad18b07be863ad1cb7aa313b2-bb6340d2f36498d8751a15e45785926ef20eb4c8
          fail-on-cache-miss: true
      - name: Restore Lean toolchain without saving
        id: elan-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install toolchain only if missing
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: .github/actions/install-lean/install.sh lean-toolchain
      - name: Put elan on path
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache with retries
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py
      - name: Restore missing frontier outputs
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - name: Check documentation pins
        run: python3 scripts/check_docs.py --config-only
      - name: Record hosted machine
        env:
          PROFILE_ROOT_KEY: ${{ steps.root-cache.outputs.cache-matched-key }}
        run: |
          mkdir -p "$RUNNER_TEMP/guide-profile-machine"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          data = {key: os.environ.get(key) for key in ('PROFILE_ROOT_KEY', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion')}
          for name, cmd in {'uname': ['uname', '-a'], 'cpu': ['lscpu'], 'disk': ['df', '-h'], 'compiler': ['cc', '--version'], 'glibc': ['ldd', '--version'], 'lean': ['lean', '--version']}.items():
              data[name] = subprocess.check_output(cmd, text=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'guide-profile-machine', 'machine.json').write_text(json.dumps(data, indent=2))
          print(json.dumps(data, indent=2))
          PYCODE
      - name: Profile cold and dependency-only warm Guide
        run: python3 -u scripts/profile_guide_dependencies.py
      - name: Upload diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-dependency-profile
          path: |
            ${{ runner.temp }}/guide-dependency-profile/report
            ${{ runner.temp }}/guide-profile-machine
          if-no-files-found: warn
          retention-days: 7
