name: Guide

# Checks the Verso guide's Lean examples when the guide, library or dependency pins change.
# Library-only changes compile the chapter library without linking the generator or rendering
# pages. Guide/tooling changes also upload rendered pages for review. The nightly documentation
# workflow continues to publish the guide from `main`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: cslib-ubuntu-24.04-8core
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Restore root outputs without saving
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: guide-native-profile-unused
          restore-keys: lake-${{ vars.CACHE_RECOVERY_GENERATION || '0' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Restore toolchain without saving
        id: elan
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install toolchain if needed
        if: steps.elan.outputs.cache-hit != 'true'
        run: .github/actions/install-lean/install.sh lean-toolchain
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib
        continue-on-error: true
        run: python3 -B scripts/cache/get_mathlib.py
      - name: Restore frontier
        continue-on-error: true
        run: scripts/cache/get-missing.sh
      - name: Compile checked chapters
        run: python3 -u scripts/profile_guide_native.py examples
      - name: Interpret generator before native compilation
        run: python3 -u scripts/profile_guide_native.py interpreted
      - name: Build and render unchanged native generator
        run: python3 -u scripts/profile_guide_native.py native
      - name: Compare complete sites and exercise failures
        run: python3 -u scripts/profile_guide_native.py compare
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-native-profile
          path: ${{ runner.temp }}/guide-native-profile
          retention-days: 30
