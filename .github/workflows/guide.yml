name: Guide failure probes
# Diagnostic branch only; production PR #5273 remains unchanged.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  COMPLEXITYLIB_CACHE_URLS: ${{ vars.COMPLEXITYLIB_CACHE_URLS }}
  DISABLE_CACHE_RESTORE: ${{ vars.DISABLE_CACHE_RESTORE }}
jobs:
  probes:
    runs-on: cslib-ubuntu-24.04-8core
    timeout-minutes: 15
    steps:
      - name: Honor repository cache kill switch
        run: |
          test "$DISABLE_CACHE_RESTORE" != true
          test "$DISABLE_CACHE_RESTORE" != 1
          echo "LAKE_CACHE_DIR=$RUNNER_TEMP/guide-failure-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Restore root outputs without saving
        id: root-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: guide-failure-probe-unused
          restore-keys: lake-${{ vars.CACHE_RECOVERY_GENERATION || '0' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Restore toolchain without saving
        id: elan
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install toolchain if needed
        if: steps.elan.outputs.cache-hit != 'true'
        run: .github/actions/install-lean/install.sh lean-toolchain
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py
      - name: Restore frontier
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - name: Establish successful helper output
        env:
          PROFILE_ROOT_CACHE: ${{ steps.root-cache.outputs.cache-matched-key }}
        run: python3 -u scripts/probe_guide_failures.py prepare
      - name: Check chapter warnings and errors
        run: python3 -u scripts/probe_guide_failures.py chapter
      - name: Check generator warnings errors and exit codes
        run: python3 -u scripts/probe_guide_failures.py generator
      - name: Check restored source and output
        run: python3 -u scripts/probe_guide_failures.py restored
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-failure-probes
          path: ${{ runner.temp }}/guide-failure-probes
          retention-days: 30
