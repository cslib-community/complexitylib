name: Inspect historical Lean handoff

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Diagnostic branch only: inspect one existing payload; no caches or Lean commands.
jobs:
  inspect-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download, validate, and inventory the successful handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -u - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import time
          import zipfile

          sys.path.insert(0, "scripts")
          import cache_handoff as handoff

          started = time.monotonic()
          repository = "cslib-community/cslib-frontier"
          source_sha = "7274dfbe50b5ba72f3b847f4340874dc522590dc"
          run_id, artifact_id = 43524375233, 14084553662
          expected_name = f"lean-build-{source_sha}-{run_id}-1"
          expected_zip_digest = "bd52ca761852b8ab955300864dc583d61f3fb9d5fab265cc3a60a92e13bcce90"
          root = Path(os.environ["RUNNER_TEMP"]) / "handoff-inspection"
          output = root / "results"
          output.mkdir(parents=True)

          def write(name, data):
              (output / name).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")

          artifact = handoff.gh_get(f"repos/{repository}/actions/artifacts/{artifact_id}")
          assert artifact["id"] == artifact_id and artifact["name"] == expected_name
          assert artifact["expired"] is False
          assert artifact["workflow_run"]["id"] == run_id
          assert artifact["workflow_run"]["head_sha"] == source_sha
          assert artifact["digest"] == "sha256:" + expected_zip_digest
          write("artifact.json", artifact)
          archive = root / "artifact.zip"
          download_started = time.monotonic()
          print(f"Downloading existing artifact {artifact_id}", flush=True)
          with archive.open("xb") as target:
              subprocess.run([
                  "gh", "api", "--method", "GET",
                  f"repos/{repository}/actions/artifacts/{artifact_id}/zip",
              ], stdout=target, check=True, timeout=420)
          download_seconds = time.monotonic() - download_started
          assert archive.stat().st_size == artifact["size_in_bytes"]
          assert handoff.digest(archive) == expected_zip_digest
          print(f"ZIP digest validated after {download_seconds:.2f}s download", flush=True)

          downloaded = root / "downloaded"
          downloaded.mkdir()
          limits = {"metadata.json": handoff.MAX_METADATA_BYTES,
                    "build.tar.gz": handoff.MAX_ARCHIVE_BYTES}
          with zipfile.ZipFile(archive) as bundle:
              members = bundle.infolist()
              assert len(members) == 2 and {item.filename for item in members} == set(limits)
              for item in members:
                  assert not item.is_dir() and 0 < item.file_size <= limits[item.filename]
                  # Copying each member to EOF verifies its ZIP CRC. Never use its path to extract.
                  with bundle.open(item) as source, (downloaded / item.filename).open("xb") as target:
                      shutil.copyfileobj(source, target)
          metadata = json.loads((downloaded / "metadata.json").read_text())
          context = {
              "version": 1, "repository": repository, "source_sha": source_sha,
              "cache_recovery_generation": "0",
              "inputs": {name: handoff.digest(Path(name)) for name in handoff.INPUTS},
              # Inspect the historical payload on its own terms, without claiming this runner
              # could consume a handoff made on another image.
              "platform": metadata["platform"],
          }
          assert set(context["platform"]) == {"RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"}
          assert all(isinstance(value, str) and value for value in context["platform"].values())
          # Reuse the production digest, inventory, path/type and timestamp validator.
          build = handoff.unpack(downloaded, root / "unpacked", context,
                                 {"id": run_id, "run_attempt": 1})
          write("metadata.json", metadata)
          print("Tar digest, source metadata and complete inventory validated", flush=True)

          archives = []
          for path in sorted(build.rglob("*.ltar")):
              archives.append({"path": ".lake/build/" + path.relative_to(build).as_posix(),
                               "bytes": path.stat().st_size, "sha256": handoff.digest(path)})
          write("archives.json", archives)
          traces = []
          shapes = Counter()
          synthetic = Counter()
          for path in sorted(build.rglob("*.trace")):
              trace = json.loads(path.read_text())
              descriptors = trace.get("outputs")
              shape = ("object:" + ",".join(sorted(descriptors))) if isinstance(descriptors, dict) else type(descriptors).__name__
              shapes[shape] += 1
              synthetic[str(trace.get("synthetic"))] += 1
              traces.append({"path": ".lake/build/" + path.relative_to(build).as_posix(),
                             "depHash": trace.get("depHash"), "synthetic": trace.get("synthetic"),
                             "outputs": descriptors})
          write("trace-descriptors.json", traces)
          summary = {
              "artifact_id": artifact_id, "producer_run_id": run_id, "source_sha": source_sha,
              "zip_sha256": expected_zip_digest, "zip_bytes": archive.stat().st_size,
              "zip_crc_and_digest_valid": True, "tar_digest_and_inventory_valid": True,
              "archive_count": len(archives), "archive_bytes": sum(item["bytes"] for item in archives),
              "trace_count": len(traces), "trace_descriptor_shapes": dict(shapes),
              "trace_synthetic_counts": dict(synthetic), "handoff_metadata": metadata,
              "post_publication_retained_snapshot_archive_count": 9539,
              "archive_count_difference": 9539 - len(archives),
              "download_seconds": download_seconds, "elapsed_seconds": time.monotonic() - started,
              "diagnostic_runner": {key: os.environ.get(key) for key in
                                    ("RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion")},
              "interpretation": "Historical successful handoff payload inventory; not a retention consumer test.",
          }
          write("summary.json", summary)
          print("HANDOFF_INVENTORY " + json.dumps(summary, sort_keys=True), flush=True)
          PY
      - name: Upload JSON results only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-handoff-inventory
          path: ${{ runner.temp }}/handoff-inspection/results/*.json
          if-no-files-found: warn
          retention-days: 7
