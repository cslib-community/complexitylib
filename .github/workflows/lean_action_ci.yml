name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# A new run for a pull request cancels that pull request's superseded run. Push runs on `main`
# share `lean-ci-main` without `cancel-in-progress`: the active `main` run finishes and uploads the
# `.lake` and remote caches, while intermediate `main` pushes are replaced by the latest `main` tip
# while pending (which is also the only revision `abstracts.yml` and `scripts/check_abstract_ci.py`
# publish). Merge-queue groups and manual runs each use their own run id so all of them complete.
concurrency:
  group: >-
    lean-ci-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    # Temporary #1728 hooks: absent plan is OFF. Activation needs a separately reviewed protocol.
    env:
      HANDOFF_MEASUREMENT_PLAN: ${{ vars.HANDOFF_MEASUREMENT_PLAN }}
    permissions:
      contents: read
      # Main may download the exact landed revision's successful merge-group build artifact.
      actions: read
      # Only the remote-cache upload on `main` pushes uses this; the Google Cloud identity pool
      # also refuses tokens for any other repository, ref or event (scripts/cache/README.md).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare optional handoff measurement
        id: handoff-measurement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFF_MEASUREMENT_PLAN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: python3 -B scripts/cache_handoff_measurement.py prepare
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: "Source hygiene"
        run: python3 -B scripts/check_hygiene.py --check-simp
      # The API documentation (docbuild/) and the guide (guide/) are separate Lake projects that
      # share the library's toolchain and `.lake/packages`, so their lockfiles must follow the root
      # pins. Checking here makes a root cslib or Mathlib bump without matching lockfile updates
      # fail before Lean setup; the Guide workflow also compiles examples for library/pin changes.
      # This reads only checked-in files: no Lean, network or `.lake`.
      - name: "Documentation pins"
        run: python3 -B scripts/check_docs.py --config-only
      # lean-action has no hook between installing the toolchain and building, so here it only
      # installs elan. The steps around it do the rest of what it did, with bounded cache retries:
      # restore and save `.lake` under the same Actions cache key, then build, test and lint.
      - name: Restore .lake from the Actions cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      # Restore the toolchain from the Actions cache, or install it with retries, so that
      # lean-action does not download it (.github/actions/install-lean, #1426).
      - uses: ./.github/actions/install-lean
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Restore Mathlib cache with retries
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py --lean-action
      # The earlier script tests run before Lean is installed and skip this real build test.
      # Exercise both compiler setup-input omissions with an isolated, cache-disabled project.
      - name: Test Lake build handoff reuse
        env:
          COMPLEXITYLIB_TEST_LAKE_HANDOFF: "1"
        run: python3 -B -m unittest discover -s scripts -p 'test_cache_handoff.py'
      # Download the outputs that `main` CI uploaded for the nearest uploaded ancestor of this
      # commit, skipping modules that `.lake` already has (scripts/cache/README.md). The script
      # deepens the depth-1 checkout to 100 generations to find that ancestor. Lake reuses an
      # output only where a module's input hash matches, so the build below still compiles every
      # module this commit affects. A miss, a timeout or an unreachable bucket only leaves the
      # build colder.
      - name: Restore build outputs from the remote cache
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -n "${HANDOFF_MEASUREMENT_LOG:-}" ]; then
            set -o pipefail
            scripts/cache/get-missing.sh | tee "$HANDOFF_MEASUREMENT_LOG"
          else
            scripts/cache/get-missing.sh
          fi
      - name: Optional controlled handoff measurement
        id: handoff-measurement-result
        if: steps.handoff-measurement.outputs.selected == 'true'
        continue-on-error: true
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
          HANDOFF_MEASUREMENT_ACTIONS_KEY: ${{ steps.lake-cache.outputs.cache-matched-key }}
        run: python3 -B scripts/cache_handoff_measurement.py measure
      # A merge-group build has already checked this exact commit before it lands on main.
      # Reuse its root outputs without granting merge groups access to the public-cache writer.
      # Missing, expired or mismatched handoffs leave the ordinary build below unchanged.
      # Set the repository variable DISABLE_BUILD_HANDOFF=1 to disable this handoff without a commit.
      - name: Restore validated merge-group build outputs
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.DISABLE_BUILD_HANDOFF != '1' && vars.DISABLE_BUILD_HANDOFF != 'true' &&
          steps.handoff-measurement-result.outputs.bypass_restore != 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: python3 -B scripts/cache_handoff.py restore
      - name: "lake build"
        run: lake build --wfail --iofail @complexitylib @/mk_all @/checkInitImports @mathlib/lint-style
      - name: "lake test"
        id: test
        run: lake test --wfail --iofail
      - name: "lake lint"
        id: lint
        run: lake lint
      # As lean-action did: keep a successful build even when tests or linting fail. Only `main`
      # pushes save: each save is about 2.8 GB, and PR or merge-queue copies would evict `main`'s
      # entry from the 10 GB Actions cache. Other runs restore `main`'s entry through the
      # restore-keys prefix and fetch anything newer from the remote cache.
      - name: Save .lake to the Actions cache
        if: >-
          ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
              steps.lake-cache.outputs.cache-hit != 'true' &&
              (success() || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure') }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      # Source hygiene that needs the build outputs: each module's count of public statements that
      # mention tidy computability (#456) must equal its baseline; proofs may use it. See
      # scripts/check_tidy_surface.py. Its tests on a compiled module need Lean, so the Python
      # tests at the start skip them; they run here.
      - name: "Tidy statement ratchet"
        run: |
          set -e
          command -v lake
          test -d .lake/packages
          python3 -B -m unittest scripts/test_check_tidy_surface.py
          python3 -B scripts/check_tidy_surface.py
      - name: "Result registry references"
        run: python3 -B scripts/results_registry.py --compiled
      # Lints for the files a pull request adds or changes: names in module docstrings' "Main …"
      # lists exist, and a new test file does more than restate signatures. See
      # scripts/check_changed_files.py. The checkout is shallow, so the base commit is fetched
      # and compared directly. On pull requests, as in the parallel-definition step below, the
      # base is the first parent of the checked-out merge commit: `pull_request.base.sha` can be
      # an older tip of `main`, and comparing with it would lint files that later commits on `main`
      # changed. Merge-group runs keep `merge_group.base_sha`, which is always fetchable.
      - name: "Changed-file lints"
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -e
          BASE=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          fi
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_changed_files.py --base "$BASE"
      # Advisory only: public definitions that a pull request adds or changes and that share a
      # large anonymized subterm with an existing definition, or only rename one (AGENTS.md, "New
      # statements and definitions"). Candidates go to the job summary and appear as notices; the
      # step never fails the job. Its compiled-fixture tests need Lean, so the Python tests at the
      # start skip them; they run here. See scripts/parallel_defs.py. The comparison base is the
      # first parent of the checked-out merge commit: `pull_request.base.sha` can be an older tip of
      # the base branch, and comparing with it would attribute later base commits to the PR.
      - name: "Parallel-definition notice (advisory)"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 10
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/parallel_defs.py --base "$BASE" --github --no-build-check
          python3 -B -m unittest scripts/test_parallel_defs.py
      # Advisory only: backticked Lean names in the PR description that the checked-out merge
      # commit does not declare (renamed or dropped while the PR evolved). It reads the sources of
      # the library, the tests, the abstracts, `.lake/packages` and the toolchain, so it runs after
      # the build; names that the base declared are marked as removed by the PR. Findings go to the
      # job summary and a notice; the step never fails the job. The body is the event payload's,
      # i.e. as of the latest push; after editing the description, run
      # `scripts/check_pr_names.py --pr N` locally. Its tests run with the Python tests at the start.
      - name: "PR description names (advisory)"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_pr_names.py --event "$GITHUB_EVENT_PATH" --base "$BASE" --github
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      - name: Test import generation with custom source directories
        run: |
          test -x .lake/build/bin/mk_all
          python3 -B -m unittest discover -s scripts -p 'test_mk_all.py'
      - name: "lake exe lint-style"
        run: |
          set -e
          lake exe lint-style
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      # Stage after every required check. Consumers also require the producer's current attempt
      # to have completed successfully; an artifact from a failed/cancelled run is never reused.
      - name: Stage merge-group build outputs
        id: cache-handoff
        if: >-
          github.event_name == 'merge_group' &&
          vars.DISABLE_BUILD_HANDOFF != '1' && vars.DISABLE_BUILD_HANDOFF != 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: python3 -B scripts/cache_handoff.py pack --output "$RUNNER_TEMP/lean-handoff"
      - name: Upload merge-group build outputs
        if: github.event_name == 'merge_group' && steps.cache-handoff.outputs.artifact-name != ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cache-handoff.outputs.artifact-name }}
          path: ${{ runner.temp }}/lean-handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      # Publish the build outputs to the remote cache read by scripts/cache/get.sh. Skipped until
      # the maintainer sets the repository variables described in scripts/cache/README.md.
      - name: "Authenticate to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.LAKE_CACHE_WIF_PROVIDER }}
          service_account: ${{ vars.LAKE_CACHE_SERVICE_ACCOUNT }}
      - name: "Upload to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        run: |
          set -e
          scripts/cache/upload.sh "${{ vars.LAKE_CACHE_BUCKET }}"
      - name: Record optional handoff measurement
        if: always() && steps.handoff-measurement.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: handoff-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          # Metadata only: the directory also holds private trial state and must never be uploaded.
          path: ${{ steps.handoff-measurement.outputs.report }}
          retention-days: 14
