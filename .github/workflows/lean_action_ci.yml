name: Retained Lake snapshot probe

on:
  workflow_dispatch:

permissions:
  contents: read

# Benchmark-only branch based on the exact retained snapshot's source revision.
# No bootstrap, handoff, preliminary build, cache save, or remote publication.
jobs:
  retained-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the exact retained main snapshot
        id: retained
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-0-Linux-X64-39707a83b53c737bd0252f90b111520c4f52892fb9aa2efa8f7d85a9861e7a74-52aaa34cb1dbb7fe55b090936195255e8e9597fad18b07be863ad1cb7aa313b2-7274dfbe50b5ba72f3b847f4340874dc522590dc
          fail-on-cache-miss: true
      - name: Require an exact snapshot hit
        env:
          CACHE_HIT: ${{ steps.retained.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      # This branch removes the composite's save step, retaining restore/install behavior.
      - uses: ./.github/actions/install-lean
      - name: Measure retained-archive staging and verify OLean contents
        env:
          RESTORED_KEY: ${{ steps.retained.outputs.cache-matched-key }}
        run: |
          python3 -B -u - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import time

          source_revision = "7274dfbe50b5ba72f3b847f4340874dc522590dc"
          output = Path(os.environ["RUNNER_TEMP"]) / "retention-probe"
          output.mkdir()

          def write(name, data):
              (output / name).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", source_revision, "HEAD"], text=True
          ).splitlines()
          assert sorted(changed) == [
              ".github/actions/install-lean/action.yml",
              ".github/workflows/lean_action_ci.yml",
          ], changed

          def snapshot():
              archives = list(Path(".lake/build").rglob("*.ltar"))
              oleans = {}
              for path in sorted(Path(".lake/build").rglob("*")):
                  if path.is_file() and path.name.endswith((".olean", ".olean.private", ".olean.server")):
                      with path.open("rb") as stream:
                          digest = hashlib.file_digest(stream, "sha256").hexdigest()
                      stat = path.stat()
                      oleans[str(path)] = {"sha256": digest, "bytes": stat.st_size,
                                          "mtime_ns": stat.st_mtime_ns}
              return {"archives": {"count": len(archives),
                                   "bytes": sum(path.stat().st_size for path in archives)},
                      "oleans": oleans}

          metadata = {
              "source_revision": source_revision,
              "workflow_revision": os.environ["GITHUB_SHA"],
              "restored_key": os.environ["RESTORED_KEY"],
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
              "machine": platform.machine(),
              "kernel": platform.release(),
              "logical_cores": os.cpu_count(),
              "available_cores": len(os.sched_getaffinity(0)),
              "lean_num_threads": os.environ.get("LEAN_NUM_THREADS"),
              "cpu_info": subprocess.check_output(["lscpu"], text=True),
              "changed_files": changed,
          }
          write("runner.json", metadata)
          print("PROBE_RUNNER " + json.dumps(metadata, sort_keys=True), flush=True)
          before = snapshot()
          assert before["oleans"], "Retained snapshot has no root OLean outputs"
          assert before["archives"]["count"] > 0, "Retained snapshot has no root archives"
          write("before.json", before)
          print("PROBE_BEFORE " + json.dumps({"archives": before["archives"],
                "olean_files": len(before["oleans"])}), flush=True)
          started = time.monotonic()
          result = subprocess.run([
              sys.executable, "-B", "-u", "scripts/cache/publish.py", "stage",
              str(Path(os.environ["RUNNER_TEMP"]) / "lake-publication-probe"),
              "--report", str(output / "staging.json"),
          ])
          elapsed = time.monotonic() - started
          after = snapshot()
          write("after.json", after)
          old, new = before["oleans"], after["oleans"]
          added, removed = sorted(new.keys() - old.keys()), sorted(old.keys() - new.keys())
          common = old.keys() & new.keys()
          content_changes = sorted(p for p in common if old[p]["sha256"] != new[p]["sha256"])
          mtime_changes = sorted(p for p in common if old[p]["mtime_ns"] != new[p]["mtime_ns"])
          summary = {
              "stage_exit_code": result.returncode, "stage_subprocess_seconds": elapsed,
              "archives_before": before["archives"], "archives_after": after["archives"],
              "olean_files_before": len(old), "olean_files_after": len(new),
              "olean_files_added": added, "olean_files_removed": removed,
              "olean_content_changes": content_changes, "olean_mtime_changes": mtime_changes,
              "olean_contents_unchanged": not (added or removed or content_changes),
          }
          write("verification.json", summary)
          print("PROBE_RESULT " + json.dumps(summary, sort_keys=True), flush=True)
          assert summary["olean_contents_unchanged"], "Staging changed root OLean contents"
          sys.exit(result.returncode)
          PY
      - name: Upload measurement JSON only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-snapshot-probe
          path: ${{ runner.temp }}/retention-probe/*.json
          if-no-files-found: warn
          retention-days: 7
