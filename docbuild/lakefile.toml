# Separate documentation project, following https://github.com/leanprover/doc-gen4.
# Inherits ../lean-toolchain. Build with: lake -d docbuild build Complexity:docs
name = "docbuild"
version = "0.1.0"
reservoir = false
packagesDir = "../.lake/packages"

[[require]]
name = "complexitylib"
path = ".."

[[require]]
name = "doc-gen4"
git = "https://github.com/SamuelSchlesinger/doc-gen4"
rev = "cf840d8fb97b0cb39238c2f78cb8dd08b9984fcc"
