# Dedicated-cache-host policy, install as
# /etc/systemd/journald.conf.d/cache-origin.conf. No duplicate rsyslog file sink.
# These caps cover nginx syslog and systemd service logs on this dedicated host.
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=16M
SystemMaxFileSize=8M
RuntimeMaxFileSize=4M
SystemKeepFree=512M
MaxRetentionSec=7day
ForwardToSyslog=no
# nginx omits successful anonymous requests and rate-limit rejections from logs;
# expected authentication logs fit this budget. Monitor 'Suppressed' journal
# notices as an operational fault: dropped logs weaken failed-auth detection.
RateLimitIntervalSec=30s
RateLimitBurst=20000
