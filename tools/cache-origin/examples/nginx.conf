# Example fragment inside nginx's http {}. Operator supplies DNS, certificates,
# cache-publish.htpasswd and the dedicated filesystem. Use an exclusive nginx
# service on a dedicated cache host; its only supplementary socket group must be
# cache-origin-proxy. Hash file: root:cache-origin-proxy 0640, bcrypt cost 4.
# Configure bounded local journald storage and the Fail2ban authentication jail supplied
# alongside this file before activation. Never exposes admin access.
limit_req_zone $binary_remote_addr zone=cache_requests:1m rate=512r/s;
limit_req_zone $server_name zone=cache_requests_global:1m rate=1024r/s;
limit_req_zone $binary_remote_addr zone=cache_uploads:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=cache_connections:1m;
limit_conn_zone $server_name zone=cache_connections_global:1m;
limit_conn_zone $binary_remote_addr zone=cache_upload_connections:1m;
# No Authorization, user name, query string or request body enters the access log.
log_format cache_origin '$remote_addr $status $request_method $uri';
# Keep usage separate from the security/error journal. Quote numeric values too
# so even an unavailable nginx variable remains valid JSON for inspection.
# Bound attacker-controlled fields below nginx's syslog message limit. Preserve
# exact valid cache keys; other paths/methods still contribute status/byte totals.
map $uri $cache_usage_uri {
    default /other;
    "~^/a0/cslib-community/complexitylib/[0-9a-f]{16}[.]art$" $uri;
    "~^/r0/cslib-community/complexitylib/tc/[A-Za-z0-9_.+-]{1,160}/[0-9a-f]{40}[.]jsonl$" $uri;
    "~^/publish/[0-9a-f]{40}$" $uri;
}
map $request_method $cache_usage_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    PUT PUT;
}
log_format cache_usage escape=json '{"time":"$time_iso8601","method":"$cache_usage_method",'
    '"uri":"$cache_usage_uri","status":"$status","bytes":"$body_bytes_sent","seconds":"$request_time"}';
# The default journal omits successful downloads and throttling rejections;
# auth failures and server failures remain observable independently of usage.
map $status $cache_loggable {
    default 0;
    401 1;
    ~^5 1;
}
# This is a dedicated-host http{} fragment: HTTP/ACME sites inherit the same
# baseline limits and bounded error sink. HTTPS below adds selective access logs.
access_log off;
error_log syslog:server=unix:/dev/log,facility=local6,tag=cache_origin_error,nohostname warn;
limit_req zone=cache_requests burst=1024 nodelay;
limit_req zone=cache_requests_global burst=2048 nodelay;
limit_req_status 429;
limit_req_log_level info;
limit_conn cache_connections 64;
limit_conn cache_connections_global 128;
limit_conn_status 429;
limit_conn_log_level info;
send_timeout 30s;
client_header_timeout 15s;
keepalive_timeout 15s;

server {
    listen 443 ssl;
    server_name cache.example.edu;
    ssl_certificate /etc/letsencrypt/live/cache.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cache.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/cache-origin/public;
    autoindex off;
    disable_symlinks on;
    access_log syslog:server=unix:/dev/log,facility=local6,tag=cache_origin,severity=info,nohostname cache_origin if=$cache_loggable;
    access_log syslog:server=unix:/run/systemd/journal.cache-origin-usage/dev-log,facility=local6,tag=cache_usage,severity=info,nohostname cache_usage;
    error_log syslog:server=unix:/dev/log,facility=local6,tag=cache_origin_error,nohostname warn;

    location = / {
        limit_except GET { deny all; }
        root /usr/local/share/cache-dashboard;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    location ~ "^/(app[.]js|style[.]css)$" {
        limit_except GET { deny all; }
        root /usr/local/share/cache-dashboard;
        default_type application/octet-stream;
        types { application/javascript js; text/css css; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /stats.json {
        limit_except GET { deny all; }
        alias /var/lib/cache-dashboard/stats.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Lake uses curl's parallel downloads (default maximum 50). Allow one such
    # batch per IP plus headroom without turning normal cold restores into 429s.
    # Bandwidth is uncapped; request/connection limits bound concurrency instead.

    # Buffer on the bounded cache filesystem, not on the OS filesystem.
    client_body_temp_path /srv/cache-origin/nginx-tmp;
    client_max_body_size 4g;
    client_body_timeout 60s;

    location ~ "^/publish/[0-9a-f]{40}$" {
        # Location-level limits replace inherited request limits, so retain the
        # global request limit as well as per-IP upload limits. Do not share a
        # tiny upload allowance across unauthenticated clients and CI publishers.
        limit_req zone=cache_requests_global burst=2048 nodelay;
        limit_req zone=cache_uploads burst=8 nodelay;
        limit_conn cache_connections_global 128;
        limit_conn cache_upload_connections 1;
        limit_except PUT { deny all; }
        auth_basic "Cache publisher";
        auth_basic_user_file /etc/nginx/cache-publish.htpasswd;
        proxy_pass http://unix:/run/cache-origin/http.sock;
        proxy_request_buffering on;
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;
        proxy_next_upstream off;
    }
    location ~ "^/a0/cslib-community/complexitylib/[0-9a-f]{16}\.art$" {
        limit_except GET { deny all; }
        default_type application/vnd.reservoir.artifact;
        # The trusted publisher may restore an expired key after GC. Never
        # promise HTTP immutability across deletion and restoration.
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ "^/r0/cslib-community/complexitylib/tc/[A-Za-z0-9_.+-]{1,160}/[0-9a-f]{40}\.jsonl$" {
        limit_except GET { deny all; }
        default_type application/vnd.reservoir.outputs+json-lines;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { return 404; }
}
