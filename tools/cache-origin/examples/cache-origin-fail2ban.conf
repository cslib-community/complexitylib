# Install as /etc/fail2ban/jail.d/cache-origin.local. Requires fail2ban,
# python3-systemd and an nftables-capable banaction. Ban/unban events stay in the
# journal; email is reserved for service failures and capacity trouble.
# Verify filter matching and enforcement before activation.
[cache-origin-auth]
enabled = true
filter = nginx-http-auth
backend = systemd
journalmatch = SYSLOG_IDENTIFIER=cache_origin_error
port = https
maxretry = 3
findtime = 10m
bantime = 1h
usedns = no
banaction = nftables-multiport
action = %(action_)s
