# Install as /etc/fail2ban/jail.d/cache-origin.local. Requires fail2ban,
# python3-systemd, an nftables-capable banaction, and working sendmail (Postfix).
# Verify filter matching and delivery with a controlled failed-login test before
# activation. Mail transport failures must remain queued and visible to operators.
[cache-origin-auth]
enabled = true
filter = nginx-http-auth
backend = systemd
journalmatch = SYSLOG_IDENTIFIER=cache-origin-error
port = https
maxretry = 3
findtime = 10m
bantime = 1h
usedns = no
banaction = nftables-multiport
mta = sendmail
destemail = edemaine@mit.edu
sender = cache-origin@complexitycache.csail.mit.edu
action = %(action_mw)s
