# Install as /etc/systemd/system/nginx.service.d/cache-origin.conf.
# This host must run only the cache nginx service. Configure its www-data worker
# identity as a member of cache-origin-proxy; no unrelated process may use it.
[Unit]
Requires=cache-origin-egress.service
After=cache-origin-egress.service
OnFailure=cache-origin-alert@%n.service

[Service]
MemoryMax=192M
TasksMax=64
