# Install as /etc/systemd/journald@cache-origin-usage.conf.d/zz-cache-origin-usage.conf.
# Separate, bounded nginx usage history; never forwards to syslog or email.
# Namespace sockets are provided by systemd-journald@cache-origin-usage.socket.
[Journal]
Storage=persistent
SplitMode=none
Compress=yes
SystemMaxUse=64M
RuntimeMaxUse=16M
SystemMaxFileSize=8M
RuntimeMaxFileSize=4M
SystemKeepFree=512M
MaxRetentionSec=7day
MaxFileSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
ReadKMsg=no
Audit=no
# Record every received request instead of sampling/rate-dropping statistics.
# The namespace's disk/age bounds, not the security journal, limit retention.
RateLimitIntervalSec=0
