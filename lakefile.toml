name = "complexitylib"
version = "0.2.0"
defaultTargets = ["Complexity"]
testDriver = "ComplexityTests"
lintDriver = "batteries/runLinter"
# Share build outputs between local checkouts (worktrees, agent sandboxes) through Lake's
# content-addressed artifact cache, so a module built in one checkout is reused by every other
# checkout with the same inputs. Restoring hard-links cached outputs back into `.lake/build`, so
# tools and CI caches that read the build directory still see a complete tree.
enableArtifactCache = true
restoreAllArtifacts = true
# The library has no native code, so its build outputs are the same on every platform and the
# remote cache (see `scripts/cache/README.md`) built on Linux CI also serves macOS checkouts.
platformIndependent = true

# Linter settings are copied verbatim from cslib's lakefile so that every module here
# compiles unchanged when it is upstreamed.
[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
# The next three linters are provided by Mathlib, but don't work here (see cslib's lakefile).
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false
# this is currently not extensible for unicode not used in Mathlib
weak.linter.unicodeLinter = false
# Stricter than cslib, as in Mathlib: every variable is bound explicitly. Code that compiles here
# compiles unchanged under cslib's default.
autoImplicit = false

# cslib is the base library. Mathlib comes transitively through cslib's own pin; never pin it
# separately. Bump this SHA together with lean-toolchain (which must equal cslib's at the SHA).
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "254e30e6d4299c51323aaeaf5f51a4763b375d4a"

[[lean_lib]]
name = "Complexity"

[[lean_lib]]
name = "ComplexityAbstracts"
srcDir = "abstracts"
leanOptions = {weak.linter.style.header = false}
allowNonModules = true

[[lean_lib]]
name = "ComplexityTests"
roots = []
globs = ["ComplexityTests.+"]
leanOptions = {weak.linter.style.header = false}
# The test files do not use the module system, but they import Mathlib, whose package sets
# `requiresModuleSystem`.
allowNonModules = true

[[lean_exe]]
name = "mk_all"
srcDir = "scripts"
root = "MkAll"
allowNonModules = true
supportInterpreter = true

[[lean_exe]]
name = "checkInitImports"
srcDir = "scripts"
root = "CheckInitImports"

# Optional statement-comparison suites; neither is a default target.
[[lean_lib]]
name = "ComplexityComparator"
srcDir = "comparator"
roots = []
globs = ["ComplexityComparator.+"]

# Generated children are explicit comparator inputs, never default build targets or aggregates.
[[lean_lib]]
name = "ComplexityComparatorChallenges"
srcDir = "comparator"
roots = []
globs = ["ComplexityComparatorChallenges.+"]
defaultFacets = []
