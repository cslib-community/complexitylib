# Keep the last usable SSH policy if the rendered Match block or full configuration is invalid.
- name: Inspect the existing cache upload SSH policy
  ansible.builtin.stat:
    path: "{{ cache_server_sshd_config }}"
  register: cache_server_previous_sshd_stat

- name: Remember the existing cache upload SSH policy
  ansible.builtin.slurp:
    src: "{{ cache_server_sshd_config }}"
  when: cache_server_previous_sshd_stat.stat.exists
  register: cache_server_previous_sshd

- name: Apply and validate the account-level cache upload boundary
  block:
    - name: Render the cache upload SSH policy
      ansible.builtin.template:
        src: sshd-cache-upload.conf.j2
        dest: "{{ cache_server_sshd_config }}"
        owner: root
        group: root
        mode: '0644'
      register: cache_server_sshd_template

    - name: Validate the complete SSH daemon configuration
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false

    - name: Resolve the effective cache upload SSH policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - "user={{ cache_server_upload_user }},host=cache-server,addr=127.0.0.1"
      changed_when: false
      register: cache_server_effective_sshd

    - name: Require the effective account-level upload boundary
      ansible.builtin.assert:
        that:
          - "'authenticationmethods publickey' in cache_server_effective_sshd.stdout_lines"
          - "('pubkeyacceptedalgorithms ' ~ cache_server_upload_pubkey_algorithms) in cache_server_effective_sshd.stdout_lines"
          - "('authorizedkeysfile ' ~ cache_server_upload_home ~ '/.ssh/authorized_keys') in cache_server_effective_sshd.stdout_lines"
          - "'authorizedkeyscommand none' in cache_server_effective_sshd.stdout_lines"
          - "'authorizedprincipalsfile /dev/null' in cache_server_effective_sshd.stdout_lines"
          - "'trustedusercakeys none' in cache_server_effective_sshd.stdout_lines"
          - "'hostbasedauthentication no' in cache_server_effective_sshd.stdout_lines"
          - "('forcecommand ' ~ cache_server_upload_command) in cache_server_effective_sshd.stdout_lines"
          - "'disableforwarding yes' in cache_server_effective_sshd.stdout_lines"
          - "'permittty no' in cache_server_effective_sshd.stdout_lines"
          - "'permituserrc no' in cache_server_effective_sshd.stdout_lines"
          - "'permituserenvironment no' in cache_server_effective_sshd.stdout_lines"
          - >-
            cache_server_effective_sshd.stdout_lines
            | select('match', '^acceptenv(?: |$)')
            | reject('match', cache_server_upload_accept_env_pattern)
            | list
            | length == 0
        fail_msg: >-
          The effective upload-account SSH policy is incomplete or accepts environment variables
          beyond LANG and LC_*. Loader, interpreter and path variables can bypass ForceCommand.

    - name: Reload a changed valid SSH policy
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: reloaded
      when: cache_server_sshd_template.changed

  rescue:
    - name: Restore the previous cache upload SSH policy
      ansible.builtin.copy:
        content: "{{ cache_server_previous_sshd.content | b64decode }}"
        dest: "{{ cache_server_sshd_config }}"
        owner: root
        group: root
        mode: '0644'
      when: cache_server_previous_sshd_stat.stat.exists

    - name: Remove an invalid first cache upload SSH policy
      ansible.builtin.file:
        path: "{{ cache_server_sshd_config }}"
        state: absent
      when: not cache_server_previous_sshd_stat.stat.exists

    - name: Validate the restored SSH daemon configuration
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false

    - name: Report failure with the previous SSH policy restored
      ansible.builtin.fail:
        msg: >-
          Cache upload SSH policy failed; the previous file was restored:
          {{ ansible_failed_result.msg | default('see failed task') }}
