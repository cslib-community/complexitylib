- name: Check cache host security invariants without changing the host
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  tasks:
    - name: Remember the original rsync installation identity
      ansible.builtin.set_fact:
        cache_server_test_original_digest: "{{ cache_server_rsync_sha256 }}"
        cache_server_test_original_prefix: "{{ cache_server_rsync_prefix }}"
        cache_server_test_original_source: "{{ cache_server_rsync_source }}"

    - name: Simulate a corrected source archive at the same upstream version
      ansible.builtin.set_fact:
        cache_server_rsync_sha256: "{{ 'b' * 64 }}"

    - name: Require a checksum change to choose fresh source and installation paths
      ansible.builtin.assert:
        that:
          - cache_server_rsync_sha256 != cache_server_test_original_digest
          - cache_server_rsync_prefix != cache_server_test_original_prefix
          - cache_server_rsync_source != cache_server_test_original_source
          - cache_server_test_original_digest in cache_server_test_original_prefix
          - cache_server_rsync_sha256 in cache_server_rsync_prefix
          - cache_server_rsync_sha256 in cache_server_rsync_source

    - name: Accept a bounded filesystem fixture
      ansible.builtin.include_tasks: validate-storage.yml
      vars:
        cache_server_mount_facts:
          - mount: /
            device: /dev/vda1
            fstype: ext4
            size_total: 34359738368
            size_available: 17179869184
            inode_total: 2097152
            inode_available: 1048576
          - mount: /srv/complexitylib-cache
            device: /dev/vdb1
            fstype: ext4
            size_total: 34359738368
            size_available: 17179869184
            inode_total: 2097152
            inode_available: 1048576

    - name: Begin with no observed rejection of a root-backed cache directory
      ansible.builtin.set_fact:
        cache_server_test_root_backed_rejected: false

    - name: Exercise rejection of a cache directory on the operating-system device
      block:
        - name: Check the root-backed cache fixture
          ansible.builtin.include_tasks: validate-storage.yml
          vars:
            cache_server_mount_facts:
              - mount: /
                device: /dev/vda1
                fstype: ext4
                size_total: 34359738368
                size_available: 17179869184
                inode_total: 2097152
                inode_available: 1048576
              - mount: /srv/complexitylib-cache
                device: /dev/vda1
                fstype: ext4
                size_total: 34359738368
                size_available: 17179869184
                inode_total: 2097152
                inode_available: 1048576

      rescue:
        - name: Require the dedicated-filesystem assertion to reject the fixture
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require a bounded dedicated cache filesystem'

        - name: Record rejection of the root-backed fixture
          ansible.builtin.set_fact:
            cache_server_test_root_backed_rejected: true

    - name: Require rejection of the root-backed cache directory
      ansible.builtin.assert:
        that:
          - cache_server_test_root_backed_rejected | bool

    - name: Begin with no observed rejection of oversized storage
      ansible.builtin.set_fact:
        cache_server_test_oversized_rejected: false

    - name: Exercise rejection of filesystem and inode counts above the reviewed ceilings
      block:
        - name: Check the oversized cache fixture
          ansible.builtin.include_tasks: validate-storage.yml
          vars:
            cache_server_mount_facts:
              - mount: /
                device: /dev/vda1
                fstype: ext4
                size_total: 34359738368
                size_available: 17179869184
                inode_total: 2097152
                inode_available: 1048576
              - mount: /srv/complexitylib-cache
                device: /dev/vdb1
                fstype: ext4
                size_total: 137438953472
                size_available: 137438953472
                inode_total: 8388608
                inode_available: 8388608

      rescue:
        - name: Require the storage-ceiling assertion to reject the fixture
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require a bounded dedicated cache filesystem'

        - name: Record rejection of the oversized fixture
          ansible.builtin.set_fact:
            cache_server_test_oversized_rejected: true

    - name: Require rejection above the reviewed storage ceilings
      ansible.builtin.assert:
        that:
          - cache_server_test_oversized_rejected | bool
