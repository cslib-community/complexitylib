# Shared by production provisioning and the Linux integration test. Compile once, on one core.
- name: Install rsync build prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - libacl1-dev
      - libattr1-dev
      - liblz4-dev
      - libssl-dev
      - libxxhash-dev
      - libzstd-dev
      - pkg-config
      - python3
      - zlib1g-dev
    state: latest
    update_cache: true
    cache_valid_time: 3600

- name: Create the versioned rsync source directory
  ansible.builtin.file:
    path: "{{ cache_server_rsync_source }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the checked upstream rsync release
  ansible.builtin.get_url:
    url: "https://github.com/RsyncProject/rsync/releases/download/v{{ cache_server_rsync_version }}/rsync-{{ cache_server_rsync_version }}.tar.gz"
    dest: "{{ cache_server_rsync_source }}/release.tar.gz"
    checksum: "sha256:{{ cache_server_rsync_sha256 }}"
    owner: root
    group: root
    mode: '0644'

- name: Unpack rsync without sharing its build outputs
  ansible.builtin.unarchive:
    src: "{{ cache_server_rsync_source }}/release.tar.gz"
    dest: "{{ cache_server_rsync_source }}"
    remote_src: true
    creates: "{{ cache_server_rsync_source }}/rsync-{{ cache_server_rsync_version }}/configure"

- name: Configure the pinned rsync release
  ansible.builtin.command:
    argv:
      - ./configure
      - "--prefix={{ cache_server_rsync_prefix }}"
      - --with-rrsync
      - --disable-md2man
      # Cache transport uses an ASCII SSH alias; it does not need IDN name conversion.
      - --disable-idn
    chdir: "{{ cache_server_rsync_source }}/rsync-{{ cache_server_rsync_version }}"
    creates: "{{ cache_server_rsync_source }}/rsync-{{ cache_server_rsync_version }}/Makefile"

- name: Build and install the pinned rsync release
  ansible.builtin.command:
    argv: [make, '-j1', install]
    chdir: "{{ cache_server_rsync_source }}/rsync-{{ cache_server_rsync_version }}"
    creates: "{{ cache_server_rsync_prefix }}/.installed"

- name: Point upstream rrsync at the matching rsync executable
  ansible.builtin.lineinfile:
    path: "{{ cache_server_rsync_prefix }}/bin/rrsync"
    regexp: '^RSYNC = '
    line: "RSYNC = '{{ cache_server_rsync_prefix }}/bin/rsync'"
    owner: root
    group: root
    mode: '0755'

- name: Check the installed restricted uploader
  ansible.builtin.command:
    argv: ["{{ cache_server_rsync_prefix }}/bin/rrsync", -help]
  changed_when: false
  register: cache_server_rrsync_help

- name: Require write-only and immutable-upload support
  ansible.builtin.assert:
    that:
      - "'-no-overwrite' in cache_server_rrsync_help.stdout"
      - "'-no-del' in cache_server_rrsync_help.stdout"
      - "'-munge' in cache_server_rrsync_help.stdout"
      - "'-wo' in cache_server_rrsync_help.stdout"

- name: Mark the complete verified installation
  ansible.builtin.copy:
    dest: "{{ cache_server_rsync_prefix }}/.installed"
    content: "{{ cache_server_rsync_version }} sha256:{{ cache_server_rsync_sha256 }}\n"
    owner: root
    group: root
    mode: '0644'
